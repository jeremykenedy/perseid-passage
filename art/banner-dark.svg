<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title description">
  <title id="title">Perseid Passage</title>
  <desc id="description">An animated meteor shower screensaver with no tracking or analytics.</desc>
  <defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs>
  <rect width="800" height="200" rx="16" fill="url(#background)" stroke="#292524"/>
  <text x="48" y="78" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">Perseid Passage</text>
  <text x="50" y="108" fill="#a8a29e" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">A living meteor shower for your TV. No tracking or analytics.</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="500" text-anchor="middle">
    <rect x="49" y="130" width="98" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#60a5fa" stroke-width=".8"/><text x="98" y="145" fill="#60a5fa">Continuous motion</text>
    <rect x="155" y="130" width="92" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#a78bfa" stroke-width=".8"/><text x="201" y="145" fill="#a78bfa">Remote settings</text>
    <rect x="255" y="130" width="118" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#4ade80" stroke-width=".8"/><text x="314" y="145" fill="#4ade80">Offline rendering</text>
  </g>
  <g transform="translate(575 35)">
    <circle cx="108" cy="65" r="72" fill="#1e293b"/>
    <circle cx="65" cy="24" r="2" fill="#60a5fa"/><circle cx="169" cy="42" r="2.4" fill="#a78bfa"/><circle cx="153" cy="112" r="1.8" fill="#c4b5fd"/>
    <path d="M36 126 144 22 92 137l-13-58z" fill="#60a5fa" opacity=".82"/>
    <circle cx="145" cy="22" r="5" fill="#fbbf24"/>
    <path d="M23 139 132 34" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>
